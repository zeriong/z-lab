<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angry Birds - Physics Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 1000;
      background: #f0f0f0;
      font-family: Arial, sans-serif;
      overflow: auto;
    }

    .screen.active {
      display: flex;
    }

    /* Main Menu */
    .menu-screen {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .menu-title {
      font-size: 72px;
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      text-align: center;
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 300px;
    }

    .btn {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
    }

    .btn-primary {
      background: #00d4ff;
      color: white;
    }

    .btn-primary:hover {
      background: #00b3cc;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: white;
      color: #667eea;
    }

    .btn-secondary:hover {
      background: #f0f0f0;
      transform: translateY(-2px);
    }

    /* Level Select Screen */
    .level-select-screen {
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      background: #f5f5f5;
    }

    .level-select-title {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 40px;
      color: #333;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      margin-bottom: 30px;
      max-width: 800px;
    }

    .level-card {
      aspect-ratio: 1;
      background: white;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 2px solid #ddd;
      transition: all 0.3s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .level-card:hover:not(.locked) {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .level-card.locked {
      opacity: 0.5;
      cursor: not-allowed;
      background: #f9f9f9;
    }

    .level-number {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }

    .level-stars {
      font-size: 20px;
      color: #ffc107;
      margin-bottom: 5px;
    }

    .level-score {
      font-size: 12px;
      color: #999;
    }

    .level-lock {
      font-size: 32px;
    }

    .level-select-back {
      background: #667eea;
      color: white;
      width: 120px;
    }

    /* Pause Overlay */
    .pause-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }

    .pause-overlay.active {
      display: flex;
    }

    .pause-modal {
      background: white;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .pause-title {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 30px;
      color: #333;
    }

    .pause-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pause-btn {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
      width: 250px;
    }

    .pause-btn-continue {
      background: #00d4ff;
      color: white;
    }

    .pause-btn-continue:hover {
      background: #00b3cc;
    }

    .pause-btn-retry {
      background: #ff9500;
      color: white;
    }

    .pause-btn-retry:hover {
      background: #e68900;
    }

    .pause-btn-menu {
      background: #667eea;
      color: white;
    }

    .pause-btn-menu:hover {
      background: #5568d3;
    }

    /* Result Screen */
    .result-screen {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .result-title {
      font-size: 48px;
      font-weight: bold;
      color: white;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .result-stars {
      font-size: 60px;
      margin-bottom: 30px;
    }

    .result-score {
      font-size: 32px;
      color: white;
      margin-bottom: 30px;
    }

    .result-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-btn {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
      width: 250px;
    }

    .result-btn-next {
      background: #00d4ff;
      color: white;
    }

    .result-btn-next:hover {
      background: #00b3cc;
    }

    .result-btn-retry {
      background: #ff9500;
      color: white;
    }

    .result-btn-retry:hover {
      background: #e68900;
    }

    .result-btn-menu {
      background: white;
      color: #667eea;
    }

    .result-btn-menu:hover {
      background: #f0f0f0;
    }

    /* HUD */
    .hud {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .score-display {
      margin-bottom: 15px;
    }

    .birds-remaining {
      font-size: 18px;
      display: flex;
      gap: 10px;
    }

    .pause-button {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid white;
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      font-weight: bold;
      aria-label: "일시정지";
    }

    .pause-button:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    @media (max-width: 768px) {
      .level-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }

      .menu-title {
        font-size: 48px;
      }

      .btn {
        padding: 12px 20px;
        font-size: 16px;
      }

      .pause-modal {
        padding: 30px;
        width: 90%;
      }

      .pause-btn, .result-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- Main Menu Screen -->
  <div id="mainMenuScreen" class="screen menu-screen active">
    <div class="menu-title">ANGRY BIRDS</div>
    <div class="menu-buttons">
      <button id="startBtn" class="btn btn-primary">Play Game</button>
      <button id="selectLevelBtn" class="btn btn-secondary">Select Level</button>
      <button id="settingsBtn" class="btn btn-secondary">Settings</button>
    </div>
  </div>

  <!-- Level Select Screen -->
  <div id="levelSelectScreen" class="screen level-select-screen">
    <div class="level-select-title">Select Level</div>
    <div id="levelGrid" class="level-grid"></div>
    <button id="backBtn" class="btn btn-primary level-select-back">Back</button>
  </div>

  <!-- Pause Overlay -->
  <div id="pauseOverlay" class="pause-overlay">
    <div class="pause-modal">
      <div class="pause-title">PAUSED</div>
      <div class="pause-buttons">
        <button id="continueBtn" class="pause-btn pause-btn-continue">Continue</button>
        <button id="retryBtn" class="pause-btn pause-btn-retry">Retry</button>
        <button id="menuBtn" class="pause-btn pause-btn-menu">Main Menu</button>
      </div>
    </div>
  </div>

  <!-- Result Screen -->
  <div id="resultScreen" class="screen result-screen">
    <div class="result-title" id="resultTitle">CLEAR!</div>
    <div id="resultStars" class="result-stars"></div>
    <div id="resultScore" class="result-score"></div>
    <div class="result-buttons">
      <button id="nextLevelBtn" class="result-btn result-btn-next">Next Level</button>
      <button id="resultRetryBtn" class="result-btn result-btn-retry">Retry</button>
      <button id="resultMenuBtn" class="result-btn result-btn-menu">Main Menu</button>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hud" style="display: none;">
    <div class="score-display">Score: <span id="scoreValue">0</span></div>
    <div class="birds-remaining" id="birdsRemaining"></div>
  </div>
  <button id="pauseBtn" class="pause-button" style="display: none;">⏸</button>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
