<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angry Birds - Physics Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-canvas {
      display: block;
      background: #87CEEB;
      touch-action: none;
      cursor: grab;
    }

    #game-canvas:active {
      cursor: grabbing;
    }

    /* UI Overlay Layer */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      font-family: inherit;
    }

    /* HUD Elements */
    .hud-score {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    .hud-birds {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
      pointer-events: none;
    }

    .bird-icon {
      width: 32px;
      height: 32px;
      background: #ff6b6b;
      border-radius: 50%;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }

    .pause-button {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      padding: 0;
      border: none;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      font-size: 24px;
      cursor: pointer;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 100;
      min-width: 44px;
      min-height: 44px;
    }

    .pause-button:hover {
      background: #fff;
    }

    .pause-button:active {
      transform: scale(0.95);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 200;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-panel {
      background: white;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      position: relative;
      z-index: 201;
    }

    .modal-panel h2 {
      font-size: 28px;
      margin-bottom: 30px;
      color: #333;
    }

    .modal-panel.result .stars {
      font-size: 48px;
      margin: 20px 0;
      letter-spacing: 10px;
    }

    .modal-panel.result .score-breakdown {
      text-align: left;
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      font-size: 14px;
      line-height: 1.8;
    }

    .modal-button {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: none;
      background: #4CAF50;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .modal-button:hover {
      background: #45a049;
    }

    .modal-button:active {
      transform: scale(0.98);
    }

    .modal-button.secondary {
      background: #2196F3;
    }

    .modal-button.secondary:hover {
      background: #0b7dda;
    }

    .modal-button.danger {
      background: #f44336;
    }

    .modal-button.danger:hover {
      background: #da190b;
    }

    /* Main Menu Screen */
    #main-menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      pointer-events: auto;
      z-index: 150;
    }

    #main-menu.active {
      display: flex;
    }

    .menu-title {
      font-size: 64px;
      font-weight: bold;
      margin-bottom: 40px;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
    }

    .menu-button {
      background: white;
      color: #667eea;
      border: none;
      padding: 15px 40px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px;
      transition: transform 0.2s;
      min-width: 200px;
    }

    .menu-button:hover {
      transform: scale(1.05);
    }

    /* Level Select Screen */
    #level-select {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      pointer-events: auto;
      z-index: 150;
      overflow-y: auto;
      padding: 40px 20px;
    }

    #level-select.active {
      display: flex;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 15px;
      max-width: 600px;
      margin-bottom: 20px;
    }

    .level-card {
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      border: none;
      padding: 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      transition: all 0.3s;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .level-card:hover:not(:disabled) {
      background: white;
      transform: scale(1.05);
    }

    .level-card:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: rgba(100, 100, 100, 0.5);
      color: #ccc;
    }

    .level-card .number {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .level-card .stars {
      font-size: 14px;
      letter-spacing: 2px;
    }

    .back-button {
      background: rgba(255, 255, 255, 0.8);
      color: #667eea;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .back-button:hover {
      background: white;
    }

    /* Debug Info */
    .debug-info {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #0f0;
      font-family: monospace;
      font-size: 12px;
      padding: 8px;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-overlay">
      <div class="hud-score">Score: <span id="score-value">0</span></div>
      <div class="hud-birds" id="birds-list"></div>
      <button class="pause-button" id="pause-btn" aria-label="Pause" title="Pause (Esc)">⏸</button>
    </div>

    <!-- Pause Overlay -->
    <div class="modal-overlay" id="pause-overlay">
      <div class="modal-panel">
        <h2>Paused</h2>
        <button class="modal-button" id="resume-btn">Resume</button>
        <button class="modal-button secondary" id="restart-btn">Restart Level</button>
        <button class="modal-button danger" id="menu-btn">Main Menu</button>
      </div>
    </div>

    <!-- Result Overlay -->
    <div class="modal-overlay" id="result-overlay">
      <div class="modal-panel result">
        <h2 id="result-title">Level Clear!</h2>
        <div class="stars" id="result-stars">⭐⭐⭐</div>
        <div class="score-breakdown" id="score-breakdown">
          <div>Blocks: <span id="score-blocks">0</span></div>
          <div>Pigs: <span id="score-pigs">0</span></div>
          <div>Birds: <span id="score-birds">0</span></div>
          <div><strong>Total: <span id="score-total">0</span></strong></div>
        </div>
        <button class="modal-button" id="next-btn">Next Level</button>
        <button class="modal-button secondary" id="restart-result-btn">Restart</button>
        <button class="modal-button danger" id="menu-result-btn">Main Menu</button>
      </div>
    </div>

    <!-- Main Menu Screen -->
    <div id="main-menu">
      <div class="menu-title">Angry Birds</div>
      <button class="menu-button" id="start-btn">Start Game</button>
      <button class="menu-button" id="level-select-btn">Level Select</button>
      <button class="menu-button" id="settings-btn">Settings</button>
    </div>

    <!-- Level Select Screen -->
    <div id="level-select">
      <h1 style="margin-bottom: 30px; font-size: 32px;">Select Level</h1>
      <div class="level-grid" id="level-grid"></div>
      <button class="back-button" id="back-btn">Back to Menu</button>
    </div>

    <!-- Debug Info -->
    <div class="debug-info" id="debug-info"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
