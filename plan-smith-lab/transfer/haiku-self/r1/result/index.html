<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angry Birds - Web Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            background: #87ceeb;
            border: 3px solid #333;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #87ceeb 0%, #e0f6ff 100%);
            cursor: crosshair;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
            font-size: 18px;
            font-weight: bold;
        }

        #score {
            flex: 1;
        }

        #stageInfo {
            flex: 1;
            text-align: center;
        }

        #pauseBtn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        #pauseBtn:hover {
            background: #ff5252;
        }

        #menuScreen, #pauseOverlay, #levelCompleteOverlay, #gameOverOverlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .overlay-content {
            background: white;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .overlay-content h1 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #333;
        }

        .overlay-content p {
            font-size: 20px;
            margin-bottom: 30px;
            color: #666;
        }

        .overlay-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .overlay-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .overlay-btn:hover {
            background: #5568d3;
        }

        .overlay-btn.danger {
            background: #ff6b6b;
        }

        .overlay-btn.danger:hover {
            background: #ff5252;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="hud">
            <div id="score">Score: 0</div>
            <div id="stageInfo">Stage 1/10 | Moves: 3/3</div>
            <button id="pauseBtn">⏸ Pause</button>
        </div>

        <div id="menuScreen">
            <div class="overlay-content">
                <h1>🐦 Angry Birds</h1>
                <p>Sling the birds and destroy the pigs!</p>
                <div class="overlay-buttons">
                    <button class="overlay-btn" id="playBtn">Play</button>
                </div>
            </div>
        </div>

        <div id="pauseOverlay">
            <div class="overlay-content">
                <h1>⏸ Paused</h1>
                <div class="overlay-buttons">
                    <button class="overlay-btn" id="resumeBtn">Resume</button>
                    <button class="overlay-btn danger" id="restartBtn">Restart</button>
                    <button class="overlay-btn danger" id="mainMenuBtn">Main Menu</button>
                </div>
            </div>
        </div>

        <div id="levelCompleteOverlay">
            <div class="overlay-content">
                <h1>✨ Level Complete!</h1>
                <p id="levelScore">Score: 0</p>
                <div class="overlay-buttons">
                    <button class="overlay-btn" id="nextBtn">Next Level</button>
                    <button class="overlay-btn danger" id="mainMenuBtn2">Main Menu</button>
                </div>
            </div>
        </div>

        <div id="gameOverOverlay">
            <div class="overlay-content">
                <h1>💀 Game Over</h1>
                <p id="gameOverScore">Final Score: 0</p>
                <div class="overlay-buttons">
                    <button class="overlay-btn" id="restartBtn2">Restart Level</button>
                    <button class="overlay-btn danger" id="mainMenuBtn3">Main Menu</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="js/gameState.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/input.js"></script>
    <script src="js/stages.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
