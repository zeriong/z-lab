<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>앵그리버드 — 물리 슬링샷</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="1280" height="720"></canvas>
    <button id="btn-pause" class="control-btn" style="right: 16px; top: 16px;">⏸</button>
    <button id="btn-mute" class="control-btn" style="right: 70px; top: 16px;">🔊</button>
    <div id="load-banner" class="load-banner">물리 엔진 로드 실패 — 인터넷 연결을 확인하세요</div>
  </div>

  <div id="ov-menu" class="overlay on">
    <div class="overlay-content">
      <h1>앵그리버드</h1>
      <p>새를 당겼다 놓아 발사</p>
      <button id="btn-start">게임시작</button>
      <button id="btn-open-select">스테이지 선택</button>
    </div>
  </div>

  <div id="ov-select" class="overlay">
    <div class="overlay-content">
      <h2>스테이지 선택</h2>
      <div id="stage-grid" class="stage-grid"></div>
      <button id="btn-select-back">메인으로</button>
    </div>
  </div>

  <div id="ov-pause" class="overlay">
    <div class="overlay-content">
      <h2>일시정지</h2>
      <button id="btn-resume">계속하기</button>
      <button id="btn-retry">다시하기</button>
      <button id="btn-home">메인으로</button>
    </div>
  </div>

  <div id="ov-clear" class="overlay">
    <div class="overlay-content">
      <h2>클리어!</h2>
      <p>점수: <span id="clear-score">0</span></p>
      <p>별: <span id="clear-stars">★</span></p>
      <button id="btn-next">다음 스테이지</button>
      <button id="btn-clear-home">메인으로</button>
    </div>
  </div>

  <div id="ov-fail" class="overlay">
    <div class="overlay-content">
      <h2>실패</h2>
      <p id="fail-msg">새를 모두 사용했습니다</p>
      <button id="btn-fail-retry">다시하기</button>
      <button id="btn-fail-home">메인으로</button>
    </div>
  </div>

  <div id="hud">
    <div id="hud-score" class="hud-text">점수: 0</div>
    <div id="hud-birds" class="hud-birds"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script src="stages.js"></script>
  <script src="physics.js"></script>
  <script src="ui.js"></script>
  <script src="game.js"></script>
</body>
</html>
