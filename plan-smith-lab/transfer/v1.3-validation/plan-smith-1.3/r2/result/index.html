<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angry Birds Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="canvas-container">
      <canvas id="game-canvas" width="1280" height="720"></canvas>
      <div id="load-banner" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ff4444; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; text-align: center;">
        물리 엔진 로드 실패 — 인터넷 연결을 확인하세요
      </div>
      <button id="btn-pause" class="hud-button">⏸</button>
      <button id="btn-mute" class="hud-button">🔊</button>
    </div>

    <!-- Overlays -->
    <div id="ov-menu" class="overlay on">
      <div class="overlay-content">
        <h1>Angry Birds Clone</h1>
        <p>새를 당겼다 놓아 발사</p>
        <button id="btn-start">게임시작</button>
        <button id="btn-open-select">스테이지 선택</button>
      </div>
    </div>

    <div id="ov-select" class="overlay">
      <div class="overlay-content">
        <h1>스테이지 선택</h1>
        <div id="stage-grid" class="stage-grid"></div>
        <button id="btn-select-back">메인으로</button>
      </div>
    </div>

    <div id="ov-pause" class="overlay">
      <div class="overlay-content">
        <h1>일시정지</h1>
        <button id="btn-resume">계속하기</button>
        <button id="btn-retry">다시하기</button>
        <button id="btn-home">메인으로</button>
      </div>
    </div>

    <div id="ov-clear" class="overlay">
      <div class="overlay-content">
        <h1>클리어!</h1>
        <p>점수: <span id="clear-score">0</span></p>
        <p>별: <span id="clear-stars">★</span></p>
        <button id="btn-next">다음 스테이지</button>
        <button id="btn-clear-home">메인으로</button>
      </div>
    </div>

    <div id="ov-fail" class="overlay">
      <div class="overlay-content">
        <h1>실패</h1>
        <p id="fail-msg">새를 모두 사용했습니다</p>
        <button id="btn-fail-retry">다시하기</button>
        <button id="btn-fail-home">메인으로</button>
      </div>
    </div>

    <!-- HUD -->
    <div id="hud">
      <div id="hud-score">점수: <span>0</span></div>
      <div id="hud-birds"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script src="stages.js"></script>
  <script src="physics.js"></script>
  <script src="ui.js"></script>
  <script src="game.js"></script>
</body>
</html>
