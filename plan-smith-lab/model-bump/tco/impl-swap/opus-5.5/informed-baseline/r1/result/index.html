<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>앵그리버드</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" data-state="MENU">
    <canvas id="game-canvas" width="1280" height="720">이 브라우저는 캔버스를 지원하지 않습니다.</canvas>

    <div id="hud">
      <div id="hud-left">
        <div id="hud-stage">스테이지 1</div>
        <div id="hud-score">점수 0</div>
      </div>
      <div id="hud-birds"></div>
      <button id="btn-pause" type="button">일시정지</button>
    </div>

    <div id="screen-main" class="screen active">
      <h1>앵그리버드</h1>
      <button id="btn-start" type="button">게임 시작</button>
      <button id="btn-stages" type="button">스테이지 선택</button>
    </div>

    <div id="screen-stages" class="screen">
      <h2>스테이지 선택</h2>
      <div id="stage-grid"></div>
      <button id="btn-stages-back" type="button">뒤로</button>
    </div>

    <div id="screen-pause" class="screen">
      <h2>일시정지</h2>
      <button id="btn-resume" type="button">계속하기</button>
      <button id="btn-retry" type="button">다시하기</button>
      <button id="btn-menu" type="button">메인으로</button>
    </div>

    <div id="screen-clear" class="screen">
      <h2>스테이지 클리어</h2>
      <div id="clear-stars">☆☆☆</div>
      <div id="clear-score">점수 0</div>
      <button id="btn-next" type="button">다음 스테이지</button>
      <button id="btn-clear-retry" type="button">다시하기</button>
      <button id="btn-clear-menu" type="button">메인으로</button>
    </div>

    <div id="screen-fail" class="screen">
      <h2>실패</h2>
      <div id="fail-msg">새를 모두 사용했습니다</div>
      <button id="btn-fail-retry" type="button">다시하기</button>
      <button id="btn-fail-menu" type="button">메인으로</button>
    </div>
  </div>

  <script src="src/util.js"></script>
  <script src="src/const.js"></script>
  <script src="src/materials.js"></script>
  <script src="src/physics.js"></script>
  <script src="src/stages.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/render.js"></script>
  <script src="src/input.js"></script>
  <script src="src/game.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
