<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>앵그리버드 - 새총 퍼즐</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-root">
    <canvas id="game-canvas" width="1280" height="720"></canvas>
    <button id="pause-btn" class="hidden" type="button" aria-label="일시정지">❚❚</button>
    <div id="screen-main" class="overlay">
      <h1 class="title">앵그리버드</h1>
      <p class="subtitle">새총으로 돼지를 물리쳐라! (10 스테이지)</p>
      <button id="btn-start" class="btn" type="button">게임 시작</button>
      <button id="btn-stages" class="btn secondary" type="button">스테이지 선택</button>
    </div>
    <div id="screen-stages" class="overlay hidden">
      <h2>스테이지 선택</h2>
      <div id="stage-grid"></div>
      <button id="btn-stages-back" class="btn secondary" type="button">뒤로</button>
    </div>
    <div id="screen-pause" class="overlay hidden">
      <h2>일시정지</h2>
      <button id="btn-resume" class="btn" type="button">계속하기</button>
      <button id="btn-pause-retry" class="btn" type="button">다시하기</button>
      <button id="btn-pause-main" class="btn secondary" type="button">메인으로</button>
    </div>
    <div id="screen-clear" class="overlay hidden">
      <h2 id="clear-title"></h2>
      <div id="clear-stars" class="stars"></div>
      <p id="clear-score"></p>
      <p id="clear-bonus"></p>
      <p id="clear-best"></p>
      <button id="btn-next" class="btn" type="button">다음 스테이지</button>
      <button id="btn-clear-retry" class="btn" type="button">다시하기</button>
      <button id="btn-clear-main" class="btn secondary" type="button">메인으로</button>
    </div>
    <div id="screen-fail" class="overlay hidden">
      <h2>실패...</h2>
      <p id="fail-text"></p>
      <button id="btn-fail-retry" class="btn" type="button">다시하기</button>
      <button id="btn-fail-main" class="btn secondary" type="button">메인으로</button>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/slingshot.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
