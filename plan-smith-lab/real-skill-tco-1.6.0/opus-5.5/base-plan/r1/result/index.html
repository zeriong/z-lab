<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>앵그리 버드</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage-root">
    <canvas id="game-canvas" width="1280" height="720"></canvas>

    <!-- 인게임 HUD: 컨테이너는 pointer-events 없음, 버튼만 클릭 가능 -->
    <div id="hud" class="hidden">
      <div class="hud-info">
        <div id="hud-stage"></div>
        <div id="hud-score"></div>
        <div id="hud-best"></div>
      </div>
      <div id="hud-hint" class="hidden"></div>
      <button id="btn-pause" class="hidden" type="button" aria-label="일시정지">❚❚</button>
    </div>

    <!-- 메인 화면 -->
    <div id="screen-main" class="screen">
      <h1 class="title">앵그리 버드</h1>
      <p class="subtitle">새총으로 돼지를 물리쳐라!</p>
      <div class="menu">
        <button id="btn-start" class="btn btn-big" type="button">게임 시작</button>
        <button id="btn-select" class="btn" type="button">스테이지 선택</button>
      </div>
      <div id="main-progress">클리어 0 / 10</div>
    </div>

    <!-- 스테이지 선택 -->
    <div id="screen-select" class="screen hidden">
      <h2 class="screen-title">스테이지 선택</h2>
      <div id="stage-grid"></div>
      <button id="btn-back" class="btn" type="button">뒤로</button>
    </div>

    <!-- 일시정지 오버레이 -->
    <div id="overlay-pause" class="overlay hidden">
      <div class="panel">
        <h2 class="panel-title">일시정지</h2>
        <button id="btn-resume" class="btn" type="button">계속하기</button>
        <button id="btn-retry-pause" class="btn" type="button">다시하기</button>
        <button id="btn-main-pause" class="btn" type="button">메인으로</button>
      </div>
    </div>

    <!-- 결과 오버레이 -->
    <div id="overlay-result" class="overlay hidden">
      <div class="panel">
        <h2 id="result-title" class="panel-title">스테이지 클리어!</h2>
        <div id="result-stars"><span class="star">★</span><span class="star">★</span><span class="star">★</span></div>
        <div id="result-score" class="result-line"></div>
        <div id="result-bonus" class="result-line small"></div>
        <div id="result-best" class="result-line small"></div>
        <div class="result-buttons">
          <button id="btn-next" class="btn" type="button">다음 스테이지</button>
          <button id="btn-retry-result" class="btn" type="button">다시하기</button>
          <button id="btn-main-result" class="btn" type="button">메인으로</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/math.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/stages.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/level.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/input.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
