<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Angry Birds Web</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="game" width="1280" height="720"></canvas>

    <div id="hud" class="layer" hidden>
      <div id="hud-left">
        <span id="hud-stage"></span>
        <span id="hud-score"></span>
        <span id="hud-birds"></span>
      </div>
      <button id="btn-pause" type="button" aria-label="일시정지" title="일시정지 (Esc)">Ⅱ</button>
    </div>

    <div id="screen-menu" class="layer screen">
      <h1>ANGRY BIRDS WEB</h1>
      <p>10개의 스테이지</p>
      <button id="btn-start" type="button">게임 시작</button>
    </div>

    <div id="screen-select" class="layer screen" hidden>
      <h2>스테이지 선택</h2>
      <div id="stage-grid"></div>
      <button id="btn-select-back" type="button">메인으로</button>
    </div>

    <div id="overlay-pause" class="layer overlay" hidden>
      <div class="panel">
        <h2>일시정지</h2>
        <button id="btn-resume" type="button">계속하기</button>
        <button id="btn-pause-restart" type="button">다시하기</button>
        <button id="btn-pause-menu" type="button">메인으로</button>
      </div>
    </div>

    <div id="overlay-result" class="layer overlay" hidden>
      <div class="panel">
        <h2 id="result-title"></h2>
        <div id="result-stars"></div>
        <p id="result-score"></p>
        <button id="btn-next" type="button">다음 스테이지</button>
        <button id="btn-result-restart" type="button">다시하기</button>
        <button id="btn-result-menu" type="button">메인으로</button>
      </div>
    </div>

    <div id="error-overlay" class="layer overlay" hidden>
      <div class="panel">
        <h2>오류</h2>
        <p>물리 엔진(Matter.js)을 불러오지 못했습니다.<br>인터넷 연결을 확인한 뒤 새로고침하세요.</p>
      </div>
    </div>
  </div>

  <!-- Matter.js 0.20.0: 1차 CDN → 실패 시 2차 → 3차 (파서 삽입 스크립트라 다음 태그 전에 로드가 끝난다) -->
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script>
    if (!window.Matter) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"><\/script>');
    }
  </script>
  <script>
    if (!window.Matter) {
      document.write('<script src="https://unpkg.com/matter-js@0.20.0/build/matter.min.js"><\/script>');
    }
  </script>

  <script src="js/config.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/slingshot.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
