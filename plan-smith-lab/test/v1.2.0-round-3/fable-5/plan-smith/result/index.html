<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>앵그리버드 웹</title>
</head>
<body>
  <div id="stage-root">
    <canvas id="game" width="960" height="540"></canvas>

    <!-- HUD (L13, L17) -->
    <div id="hud" class="hidden">
      <div id="hud-left">
        <span id="hud-birds"></span>
        <span id="hud-score">점수 0</span>
      </div>
      <button id="btn-pause" type="button">일시정지</button>
    </div>

    <!-- 메인 화면 (L21) -->
    <div id="screen-main" class="screen">
      <h1>앵그리버드</h1>
      <button id="btn-start" class="btn-primary" type="button">게임시작</button>
      <p id="storage-warn" class="notice hidden">저장소를 사용할 수 없어 진행이 이 세션에만 유지됩니다.</p>
    </div>

    <!-- 스테이지 선택 (L2, L3) -->
    <div id="screen-select" class="screen hidden">
      <h2>스테이지 선택</h2>
      <div id="stage-grid"></div>
      <button id="btn-select-back" type="button">메인으로</button>
    </div>

    <!-- 일시정지 오버레이 (L17~L20) -->
    <div id="overlay-pause" class="screen overlay hidden">
      <h2>일시정지</h2>
      <div class="btn-col">
        <button id="btn-resume" type="button">계속하기</button>
        <button id="btn-pause-retry" type="button">다시하기</button>
        <button id="btn-pause-main" type="button">메인으로</button>
      </div>
    </div>

    <!-- 클리어 오버레이 (L11, L15) -->
    <div id="overlay-clear" class="screen overlay hidden">
      <h2>스테이지 클리어!</h2>
      <div id="clear-stars"></div>
      <p id="clear-score"></p>
      <div class="btn-row">
        <button id="btn-next" type="button">다음</button>
        <button id="btn-clear-retry" type="button">다시하기</button>
        <button id="btn-clear-main" type="button">메인으로</button>
      </div>
    </div>

    <!-- 실패 오버레이 (L12) -->
    <div id="overlay-fail" class="screen overlay hidden">
      <h2>실패…</h2>
      <p class="notice">새를 모두 사용했습니다.</p>
      <div class="btn-row">
        <button id="btn-fail-retry" type="button">다시하기</button>
        <button id="btn-fail-main" type="button">메인으로</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
