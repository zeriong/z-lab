<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>앵그리버드 — 10 스테이지</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: rgb(12, 16, 24);
        overflow: hidden;
        font-family: 'Trebuchet MS', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
        display: block;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: default;
      }
      #fatal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        color: rgb(240, 240, 240);
        font-size: 18px;
        text-align: center;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
    </div>
    <div id="fatal"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
