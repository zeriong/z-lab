<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angry Birds Web Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #87CEEB;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #E0F6FF;
        }

        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .menu-content {
            text-align: center;
            background: white;
            padding: 60px 80px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .menu-content h1 {
            font-size: 48px;
            color: #FF6347;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .menu-button {
            background: #FF6347;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s ease;
            font-weight: bold;
        }

        .menu-button:hover {
            background: #FF4500;
        }

        .pause-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .pause-content {
            text-align: center;
            background: white;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .pause-content h2 {
            font-size: 36px;
            color: #333;
            margin-bottom: 30px;
        }

        .pause-buttons {
            display: flex;
            gap: 15px;
            flex-direction: column;
        }

        .pause-button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
            font-weight: bold;
        }

        .pause-button:hover {
            background: #45a049;
        }

        .pause-button.restart {
            background: #FF9800;
        }

        .pause-button.restart:hover {
            background: #e68900;
        }

        .pause-button.menu {
            background: #2196F3;
        }

        .pause-button.menu:hover {
            background: #0b7dda;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 100px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .hud-item {
            margin-bottom: 10px;
        }

        .pause-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #FF6347;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
            z-index: 101;
        }

        .pause-btn:hover {
            background: #FF4500;
        }

        .clear-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .clear-content {
            text-align: center;
            background: white;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .clear-content h2 {
            font-size: 36px;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        .stars {
            font-size: 48px;
            margin: 20px 0;
        }

        .clear-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .clear-button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
            font-weight: bold;
        }

        .clear-button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas"></canvas>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>
