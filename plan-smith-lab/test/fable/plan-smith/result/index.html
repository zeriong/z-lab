<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>슬링샷 버드 — 물리 슬링샷 게임</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="1280" height="720"></canvas>

  <div id="hud" class="hidden">
    <div id="hud-left">
      <span id="stage-label"></span>
      <span id="birds-label"></span>
    </div>
    <div id="hud-right">
      <button id="btn-replay" class="hidden" title="솔루션 리플레이 (개발 모드)">▶ 리플레이</button>
      <button id="btn-pause" aria-label="일시정지">&#10074;&#10074;</button>
    </div>
  </div>

  <div id="dev-info" class="hidden"></div>

  <div id="screen-main" class="screen">
    <h1>슬링샷 버드</h1>
    <p class="subtitle">스테이지를 선택하세요</p>
    <div id="stage-grid"></div>
  </div>

  <div id="overlay-pause" class="screen overlay hidden">
    <div class="panel">
      <h2>일시정지</h2>
      <button id="btn-resume">계속하기</button>
      <button id="btn-retry-pause">다시하기</button>
      <button id="btn-main-pause">메인으로</button>
    </div>
  </div>

  <div id="overlay-clear" class="screen overlay hidden">
    <div class="panel">
      <h2>스테이지 클리어!</h2>
      <button id="btn-next">다음 스테이지</button>
      <button id="btn-retry-clear">다시하기</button>
      <button id="btn-main-clear">메인으로</button>
    </div>
  </div>

  <div id="overlay-fail" class="screen overlay hidden">
    <div class="panel">
      <h2>실패...</h2>
      <button id="btn-retry-fail">다시하기</button>
      <button id="btn-main-fail">메인으로</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
