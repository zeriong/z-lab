<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Angry Birds Web</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="game">
    <canvas id="canvas" width="1280" height="720"></canvas>

    <!-- HUD (인게임) -->
    <div id="hud" class="hidden">
      <div id="hud-left">
        <span id="hud-stage">STAGE 1</span>
        <span id="hud-score">SCORE 0</span>
        <span id="hud-birds">남은 새 0</span>
      </div>
      <button id="btn-pause" aria-label="일시정지">&#10074;&#10074;</button>
    </div>

    <!-- 메인 메뉴 -->
    <div id="main-menu" class="overlay menu-bg">
      <h1>Angry Birds Web</h1>
      <p class="subtitle">스테이지를 선택하세요</p>
      <div id="stage-grid"></div>
    </div>

    <!-- 일시정지 오버레이 -->
    <div id="pause-overlay" class="overlay dim hidden">
      <div class="panel">
        <h2>일시정지</h2>
        <button id="btn-resume">계속하기</button>
        <button id="btn-pause-retry">다시하기</button>
        <button id="btn-pause-main">메인으로</button>
      </div>
    </div>

    <!-- 클리어 / 실패 오버레이 -->
    <div id="result-overlay" class="overlay dim hidden">
      <div class="panel">
        <h2 id="result-title">STAGE CLEAR!</h2>
        <p id="result-score"></p>
        <button id="btn-next">다음 스테이지</button>
        <button id="btn-result-retry">다시하기</button>
        <button id="btn-result-main">메인으로</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
