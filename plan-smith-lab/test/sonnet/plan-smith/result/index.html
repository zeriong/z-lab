<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>슬링샷 디펜스 - 앵그리버드형 물리 게임</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ================= MAIN MENU ================= -->
  <section id="screen-main" class="screen active">
    <div class="menu-box">
      <h1 class="title">SLINGSHOT<br><span>DEFENSE</span></h1>
      <p class="subtitle">돼지들의 요새를 무너뜨려라</p>
      <button id="btn-start" class="btn btn-primary">게임 시작</button>
      <button id="btn-how" class="btn btn-ghost">조작법</button>
      <p class="progress-hint" id="main-progress-hint"></p>
    </div>
  </section>

  <!-- ================= HOW TO PLAY ================= -->
  <section id="screen-how" class="screen">
    <div class="menu-box">
      <h2>조작법</h2>
      <ul class="howto-list">
        <li>새를 <b>드래그</b>하여 당긴 뒤 <b>놓으면</b> 발사됩니다.</li>
        <li>점선은 예상 궤적입니다. 각도와 파워를 조절해 조준하세요.</li>
        <li>구조물에 충돌하면 충격량에 따라 파괴됩니다.</li>
        <li>모든 돼지를 제거하면 <b>클리어</b>, 새를 모두 소진하면 <b>실패</b>합니다.</li>
        <li>우측 상단의 <b>일시정지 버튼</b>으로 언제든 멈출 수 있습니다.</li>
      </ul>
      <button id="btn-how-back" class="btn btn-primary">돌아가기</button>
    </div>
  </section>

  <!-- ================= STAGE SELECT ================= -->
  <section id="screen-stage-select" class="screen">
    <div class="menu-box wide">
      <h2>스테이지 선택</h2>
      <div id="stage-grid" class="stage-grid"></div>
      <button id="btn-stage-back" class="btn btn-ghost">메인으로</button>
    </div>
  </section>

  <!-- ================= GAME ================= -->
  <section id="screen-game" class="screen">
    <div id="game-container">
      <canvas id="game-canvas" width="960" height="540"></canvas>

      <div id="hud">
        <div id="hud-left">
          <div id="hud-stage-name">스테이지 1</div>
          <div id="hud-score">SCORE 0</div>
        </div>
        <div id="hud-birds"></div>
      </div>

      <!-- Pause button: required to sit on the right side of the in-game HUD -->
      <button id="btn-pause" class="hud-icon-btn" aria-label="일시정지">❚❚</button>

      <!-- ============ PAUSE OVERLAY ============ -->
      <div id="overlay-pause" class="overlay">
        <div class="overlay-box">
          <h2>일시정지</h2>
          <button id="btn-resume" class="btn btn-primary">계속하기</button>
          <button id="btn-restart-pause" class="btn btn-ghost">다시하기</button>
          <button id="btn-main-pause" class="btn btn-ghost">메인으로</button>
        </div>
      </div>

      <!-- ============ RESULT OVERLAY (clear / fail) ============ -->
      <div id="overlay-result" class="overlay">
        <div class="overlay-box">
          <h2 id="result-title">스테이지 클리어!</h2>
          <div id="result-stars" class="stars"></div>
          <p id="result-score">SCORE 0</p>
          <button id="btn-next" class="btn btn-primary">다음 스테이지</button>
          <button id="btn-restart-result" class="btn btn-ghost">다시하기</button>
          <button id="btn-main-result" class="btn btn-ghost">메인으로</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Matter.js physics engine (vendored locally, no CDN dependency) -->
  <script src="js/vendor/matter.min.js"></script>

  <script src="js/data/stages.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/rng.js"></script>
  <script src="js/core/physics.js"></script>
  <script src="js/core/collision.js"></script>
  <script src="js/core/slingshot.js"></script>
  <script src="js/core/render.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
