<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angry Birds Web</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="game-root">
  <canvas id="game-canvas" width="960" height="540"></canvas>

  <div id="hud">
    <div id="hud-left">
      <span id="stage-label">Stage 1</span>
      <span id="score-label">Score: 0</span>
      <span id="birds-label">Birds: 0</span>
    </div>
    <button id="pause-btn" class="hud-button" title="일시정지" style="display:none">II</button>
  </div>

  <div id="menu-overlay" class="overlay">
    <h1>Angry Birds Web</h1>
    <p class="hint">스테이지를 선택하세요 (순차 잠금 해제)</p>
    <div id="stage-grid"></div>
  </div>

  <div id="pause-overlay" class="overlay hidden">
    <h2>일시정지</h2>
    <button data-action="resume">계속하기</button>
    <button data-action="retry">다시하기</button>
    <button data-action="menu">메인으로</button>
  </div>

  <div id="clear-overlay" class="overlay hidden">
    <h2>Stage Clear!</h2>
    <p id="clear-score"></p>
    <button data-action="next">다음 스테이지</button>
    <button data-action="retry">다시하기</button>
    <button data-action="menu">메인으로</button>
  </div>

  <div id="fail-overlay" class="overlay hidden">
    <h2>실패</h2>
    <button data-action="retry">다시하기</button>
    <button data-action="menu">메인으로</button>
  </div>
</div>

<!--
  Classic (non-module) scripts loaded in dependency order into a single
  shared namespace (window.AB). type="module" + fetch() of stage JSON both
  fail under file:// (no server); this build must open directly from disk,
  so all data lives in js/stages.js as a plain JS array, and there are no
  import/export statements anywhere.
-->
<script src="js/rng.js"></script>
<script src="js/physics.js"></script>
<script src="js/judge.js"></script>
<script src="js/stages.js"></script>
<script src="js/slingshot.js"></script>
<script src="js/renderer.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
