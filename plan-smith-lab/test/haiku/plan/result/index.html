<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angry Birds Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #87ceeb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
      background: linear-gradient(180deg, #87ceeb 0%, #e0f6ff 100%);
      border: 2px solid #333;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .pause-button {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 50px;
      height: 50px;
      background-color: #ff6b6b;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      z-index: 100;
      transition: background-color 0.3s;
    }

    .pause-button:hover {
      background-color: #ff5252;
    }

    .pause-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 200;
    }

    .pause-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: white;
      padding: 40px;
      border-radius: 10px;
      text-align: center;
      z-index: 300;
      min-width: 300px;
    }

    .pause-modal h2 {
      margin-bottom: 30px;
      font-size: 28px;
      color: #333;
    }

    .pause-modal-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .pause-modal button {
      padding: 15px 30px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
      min-width: 120px;
    }

    .restart-btn {
      background-color: #4CAF50;
      color: white;
    }

    .restart-btn:hover {
      background-color: #45a049;
    }

    .menu-btn {
      background-color: #008CBA;
      color: white;
    }

    .menu-btn:hover {
      background-color: #007399;
    }

    .menu-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      display: none;
      z-index: 400;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .menu-content {
      text-align: center;
    }

    .menu-content h1 {
      font-size: 48px;
      color: white;
      margin-bottom: 40px;
    }

    .stages-grid {
      display: grid;
      grid-template-columns: repeat(5, 100px);
      gap: 10px;
      margin-bottom: 40px;
    }

    .stage-btn {
      width: 100px;
      height: 100px;
      font-size: 24px;
      border: 2px solid white;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    .stage-btn:hover {
      background-color: #45a049;
    }

    .result-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      display: none;
      z-index: 500;
    }

    .result-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: white;
      padding: 40px;
      border-radius: 10px;
      text-align: center;
      z-index: 510;
      min-width: 350px;
    }

    .result-modal h2 {
      font-size: 36px;
      margin-bottom: 20px;
      color: #333;
    }

    .result-score {
      font-size: 24px;
      margin-bottom: 30px;
      color: #666;
    }

    .result-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .result-buttons button {
      padding: 15px 25px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .next-stage-btn {
      background-color: #4CAF50;
      color: white;
    }

    .next-stage-btn:hover {
      background-color: #45a049;
    }

    .result-menu-btn {
      background-color: #008CBA;
      color: white;
    }

    .result-menu-btn:hover {
      background-color: #007399;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <button class="pause-button" id="pauseBtn">❚❚</button>

    <div class="pause-overlay" id="pauseOverlay">
      <div class="pause-modal">
        <h2>Game Paused</h2>
        <div class="pause-modal-buttons">
          <button class="restart-btn" id="restartBtn">Restart</button>
          <button class="menu-btn" id="pauseMenuBtn">Main Menu</button>
        </div>
      </div>
    </div>

    <div class="menu-overlay" id="menuOverlay">
      <div class="menu-content">
        <h1>Angry Birds</h1>
        <div class="stages-grid" id="stagesGrid"></div>
      </div>
    </div>

    <div class="result-overlay" id="resultOverlay">
      <div class="result-modal">
        <h2 id="resultTitle">Level Complete!</h2>
        <div class="result-score" id="resultScore">Score: 0</div>
        <div class="result-buttons">
          <button class="next-stage-btn" id="nextStageBtn">Next Stage</button>
          <button class="result-menu-btn" id="resultMenuBtn">Main Menu</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/2.0.20/matter.min.js"></script>
  <script src="state.js"></script>
  <script src="physics.js"></script>
  <script src="slingshot.js"></script>
  <script src="renderer.js"></script>
  <script src="stage.js"></script>
  <script src="ui.js"></script>
  <script src="main.js"></script>
</body>
</html>
