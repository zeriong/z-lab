<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angry Birds - Web Edition</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <button id="pause-btn" class="pause-btn">PAUSE</button>
    </div>

    <!-- Pause Overlay -->
    <div id="pause-overlay" class="overlay hidden">
        <div class="overlay-content">
            <h2>PAUSED</h2>
            <button class="overlay-btn" id="resume-btn">Resume</button>
            <button class="overlay-btn" id="restart-btn">Restart Level</button>
            <button class="overlay-btn" id="menu-btn">Main Menu</button>
        </div>
    </div>

    <!-- Clear Overlay -->
    <div id="clear-overlay" class="overlay hidden">
        <div class="overlay-content">
            <h2>LEVEL CLEAR!</h2>
            <p id="clear-message"></p>
            <button class="overlay-btn" id="next-btn">Next Level</button>
            <button class="overlay-btn" id="menu-btn-clear">Main Menu</button>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="overlay hidden">
        <div class="overlay-content">
            <h1>ANGRY BIRDS</h1>
            <div id="stage-list" class="stage-list"></div>
            <button class="overlay-btn" id="start-btn">Start Game</button>
        </div>
    </div>

    <!-- Matter.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/2.0.20/matter.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
