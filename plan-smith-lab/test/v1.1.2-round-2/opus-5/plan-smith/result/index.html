<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="dark light" />
    <title>앵그리버드 — 10 스테이지</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- #viewport: 창 전체. #stage-layer: 논리 1280x720 고정 → 레터박스 스케일(main.ts) -->
    <div id="viewport">
      <div id="stage-layer">
        <canvas id="game-canvas" width="1280" height="720"></canvas>

        <!-- 인게임 HUD: 좌측 정보 / 우측 일시정지 버튼 (하드 제약 R3) -->
        <div id="hud" class="hidden" aria-hidden="true">
          <div id="hud-left">
            <div class="hud-chip"><span class="hud-label">STAGE</span><span id="hud-stage">1</span></div>
            <div class="hud-chip"><span class="hud-label">SCORE</span><span id="hud-score">0</span></div>
            <div class="hud-chip"><span class="hud-label">BIRDS</span><span id="hud-birds">••</span></div>
          </div>
          <div id="hud-right">
            <button id="btn-pause" class="icon-btn" type="button" aria-label="일시정지 (Esc)">
              <span class="pause-glyph"></span>
            </button>
          </div>
        </div>

        <!-- 메인 화면 -->
        <section id="screen-main" class="screen" aria-label="메인 화면">
          <div class="panel panel-title">
            <h1 class="game-title">ANGRY <span>BIRDS</span></h1>
            <p class="game-sub">10 스테이지 슬링샷 물리 게임</p>
            <div class="btn-col">
              <button id="btn-start" class="btn btn-primary" type="button">게임 시작</button>
              <button id="btn-select" class="btn" type="button">스테이지 선택</button>
              <button id="btn-mute-main" class="btn btn-ghost" type="button" aria-pressed="false">소리 켜짐</button>
            </div>
            <p class="hint">마우스/터치로 새를 당겨 놓으면 발사됩니다. 대시새는 비행 중 탭.</p>
          </div>
        </section>

        <!-- 스테이지 선택 -->
        <section id="screen-select" class="screen hidden" aria-label="스테이지 선택">
          <div class="panel">
            <h2 class="panel-h">스테이지 선택</h2>
            <div id="stage-grid" class="stage-grid"></div>
            <div class="btn-row">
              <button id="btn-select-back" class="btn" type="button">메인으로</button>
            </div>
          </div>
        </section>

        <!-- 일시정지 오버레이 (R3: 다시하기 / 메인으로) -->
        <section id="screen-pause" class="screen overlay hidden" aria-label="일시정지">
          <div class="panel panel-narrow">
            <h2 class="panel-h">일시정지</h2>
            <div class="btn-col">
              <button id="btn-resume" class="btn btn-primary" type="button">계속하기</button>
              <button id="btn-retry-pause" class="btn" type="button">다시하기</button>
              <button id="btn-home-pause" class="btn" type="button">메인으로</button>
              <button id="btn-mute-pause" class="btn btn-ghost" type="button" aria-pressed="false">소리 켜짐</button>
            </div>
          </div>
        </section>

        <!-- 결과 화면 (클리어 / 실패 공용) -->
        <section id="screen-result" class="screen overlay hidden" aria-label="결과">
          <div class="panel panel-narrow">
            <h2 id="result-title" class="panel-h">스테이지 클리어!</h2>
            <div id="result-stars" class="stars">
              <span class="star" data-i="0">★</span>
              <span class="star" data-i="1">★</span>
              <span class="star" data-i="2">★</span>
            </div>
            <ul id="result-breakdown" class="breakdown"></ul>
            <p id="result-total" class="result-total">0</p>
            <div class="btn-col">
              <button id="btn-next" class="btn btn-primary" type="button">다음 스테이지</button>
              <button id="btn-retry-result" class="btn" type="button">다시하기</button>
              <button id="btn-home-result" class="btn" type="button">메인으로</button>
            </div>
          </div>
        </section>

        <div id="toast" class="toast hidden" role="status"></div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
