<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Angry Slingshot — 10 Stages</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐦</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="stage-wrap">
    <div id="game-frame">
      <canvas id="game" width="1280" height="720"></canvas>

      <!-- in-game HUD: pause button lives on the RIGHT -->
      <div id="hud">
        <div id="hud-left">
          <span id="hud-stage">Stage</span>
          <span id="hud-birds" class="chip">🐦 0</span>
          <span id="hud-pigs" class="chip">🐷 0</span>
        </div>
        <button id="btn-pause" title="일시정지" aria-label="일시정지">⏸</button>
      </div>

      <!-- MAIN MENU -->
      <div id="ov-menu" class="overlay">
        <div class="panel wide">
          <h1>ANGRY <span>SLINGSHOT</span></h1>
          <p class="sub">새총을 당겨 쏴 돼지를 모두 없애세요 — 10개의 스테이지</p>
          <div id="stage-grid" class="stage-grid"></div>
          <p class="hint">드래그해서 조준 · 놓으면 발사 · 우측 ⏸ 로 일시정지</p>
        </div>
      </div>

      <!-- PAUSE -->
      <div id="ov-pause" class="overlay hidden">
        <div class="panel">
          <h2>일시정지</h2>
          <button id="btn-resume" class="btn primary">계속하기</button>
          <button id="btn-pause-restart" class="btn">다시하기</button>
          <button id="btn-pause-menu" class="btn ghost">메인으로</button>
        </div>
      </div>

      <!-- CLEAR -->
      <div id="ov-clear" class="overlay hidden">
        <div class="panel">
          <h2 id="clear-title">클리어!</h2>
          <button id="btn-next" class="btn primary">다음 스테이지</button>
          <button id="btn-clear-restart" class="btn">다시하기</button>
          <button id="btn-clear-menu" class="btn ghost">메인으로</button>
        </div>
      </div>

      <!-- FAIL -->
      <div id="ov-fail" class="overlay hidden">
        <div class="panel">
          <h2>실패…</h2>
          <p class="sub">새가 모두 떨어졌어요. 다시 도전!</p>
          <button id="btn-fail-restart" class="btn primary">다시하기</button>
          <button id="btn-fail-menu" class="btn ghost">메인으로</button>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/matter.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/stages.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
