<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>앵그리버드</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>

    <button id="btn-pause" class="hidden" type="button" aria-label="일시정지">
      <span class="bar"></span><span class="bar"></span>
    </button>

    <div id="screen-main" class="overlay overlay-light hidden">
      <div class="panel">
        <h1 class="title">앵그리버드</h1>
        <p class="subtitle">새총으로 새를 날려 돼지를 모두 물리치세요!</p>
        <div class="btn-col">
          <button id="btn-start" class="btn btn-primary" type="button">게임 시작</button>
          <button id="btn-select" class="btn" type="button">스테이지 선택</button>
        </div>
      </div>
    </div>

    <div id="screen-select" class="overlay hidden">
      <div class="panel panel-wide">
        <h2>스테이지 선택</h2>
        <div id="stage-grid" class="stage-grid"></div>
        <div class="btn-col">
          <button id="btn-select-back" class="btn btn-secondary" type="button">뒤로</button>
        </div>
      </div>
    </div>

    <div id="overlay-pause" class="overlay hidden">
      <div class="panel">
        <h2>일시정지</h2>
        <div class="btn-col">
          <button id="btn-resume" class="btn btn-primary" type="button">계속하기</button>
          <button id="btn-retry-pause" class="btn" type="button">다시하기</button>
          <button id="btn-main-pause" class="btn btn-secondary" type="button">메인으로</button>
        </div>
      </div>
    </div>

    <div id="overlay-result" class="overlay hidden">
      <div class="panel">
        <h2 id="result-title">스테이지 클리어!</h2>
        <div id="result-stars" class="stars"></div>
        <p id="result-score" class="result-line"></p>
        <p id="result-best" class="result-line"></p>
        <p id="result-allclear" class="allclear hidden">모든 스테이지를 클리어했습니다!</p>
        <div class="btn-col">
          <button id="btn-next" class="btn btn-primary" type="button">다음 스테이지</button>
          <button id="btn-retry-result" class="btn" type="button">다시하기</button>
          <button id="btn-main-result" class="btn btn-secondary" type="button">메인으로</button>
        </div>
      </div>
    </div>

    <div id="overlay-error" class="overlay hidden">
      <div class="panel panel-wide">
        <h2>오류</h2>
        <p id="error-message"></p>
        <p class="error-hint">페이지를 새로고침하면 다시 시작합니다.</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script>window.Matter || document.write('<script src="vendor/matter.min.js"><\/script>');</script>
  <script src="js/config.js"></script>
  <script src="js/stages.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/level.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
