<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>앵그리버드 웹</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="game-root">
    <canvas id="game-canvas" width="1024" height="576"></canvas>

    <!-- 인게임 HUD (§3-2). PLAYING 상태에서만 표시. -->
    <div id="hud" class="hidden">
      <div id="hud-left">
        <div id="hud-stage-name">-</div>
        <div id="hud-birds"></div>
        <div id="hud-score">SCORE 0</div>
      </div>
      <button id="pause-button" type="button" aria-label="일시정지">II</button>
    </div>

    <!-- 메인 메뉴 (§3-1) -->
    <div id="overlay-main-menu" class="overlay">
      <div class="panel">
        <h1>앵그리버드 웹</h1>
        <button id="btn-start" type="button" class="btn-primary">시작</button>
        <div id="stage-grid" class="stage-grid"></div>
      </div>
    </div>

    <!-- 일시정지 오버레이 (§3-3) -->
    <div id="overlay-paused" class="overlay hidden">
      <div class="panel">
        <h2>일시정지</h2>
        <button id="btn-resume" type="button" class="btn-primary">계속하기</button>
        <button id="btn-pause-restart" type="button">다시하기</button>
        <button id="btn-pause-main" type="button">메인으로</button>
      </div>
    </div>

    <!-- 스테이지 클리어 오버레이 (§3-4) -->
    <div id="overlay-clear" class="overlay hidden">
      <div class="panel">
        <h2 id="clear-title">스테이지 클리어!</h2>
        <div id="clear-stars" class="stars"></div>
        <div id="clear-score">SCORE 0</div>
        <button id="btn-next-stage" type="button" class="btn-primary">다음 스테이지</button>
        <button id="btn-clear-main" type="button">메인으로</button>
      </div>
    </div>

    <!-- 스테이지 실패 오버레이 (§3-5) -->
    <div id="overlay-failed" class="overlay hidden">
      <div class="panel">
        <h2>실패</h2>
        <p>새를 모두 사용했지만 돼지가 남아있습니다.</p>
        <button id="btn-failed-restart" type="button" class="btn-primary">다시하기</button>
        <button id="btn-failed-main" type="button">메인으로</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
